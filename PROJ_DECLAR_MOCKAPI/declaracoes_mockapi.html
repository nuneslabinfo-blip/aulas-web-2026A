<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Declarações e Mensagens</title>
    <style>
        
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; padding: 20px; display: flex; justify-content: center; }
        main { background-color: #ffffff; width: 100%; max-width: 850px; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        h1, h2 { color: #2c3e50; margin-bottom: 20px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        h2 { margin-top: 40px; }
        .form-grupo { display: flex; gap: 15px; margin-bottom: 15px; }
        .campo { display: flex; flex-direction: column; flex: 1; }
        label { font-weight: 600; margin-bottom: 5px; color: #333; }
        input, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        textarea { resize: vertical; height: 80px; }
        .btn-gravar { background-color: #27ae60; width: 100%; margin-top: 10px; padding: 12px; font-size: 16px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-gravar:hover { background-color: #219150; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        th { background-color: #f8f9fa; color: #2c3e50; font-weight: 600; }
        tr:hover { background-color: #fdfdfd; }
    </style>
</head>
<body>

<main>
    <h1>Mural de Declarações e Mensagens</h1>
    
    <form id="formMensagem" onsubmit="gravarNoMockApi(event)">
        <div class="form-grupo">
            <div class="campo">
                <label>Autor da Mensagem:</label>
                <input type="text" id="autor" required placeholder="Ex: João Silva">
            </div>
            <div class="campo">
                <label>Título / Assunto:</label>
                <input type="text" id="titulo" required placeholder="Ex: Declaração de Escopo">
            </div>
        </div>

        <div class="form-grupo">
            <div class="campo">
                <label>Setor / Tipo:</label>
                <input type="text" id="setor" required placeholder="Ex: Informativo, Importante...">
            </div>
            <div class="campo">
                <label>Conteúdo da Declaração:</label>
                <textarea id="conteudo" required placeholder="Escreva sua mensagem aqui..."></textarea>
            </div>
        </div>

        <button type="submit" class="btn-gravar">Publicar Declaração</button>
    </form>

    <h2>Mensagens e Declarações Registradas</h2>
    <table>
        <thead>
            <tr>
                <th>Autor</th>
                <th>Título / Assunto</th>
                <th>Setor / Tipo</th>
                <th>Mensagem / Declaração</th>
            </tr>
        </thead>
        <tbody id="tabelaCorpo">
            </tbody>
    </table>
</main>

<script>
    // URL apontando para o 'declaracoes'
    const URL_MOCKAPI = 'https://6a3b272fe4a07f202e149937.mockapi.io/api/cep/v1/declaracoes';

    // PARTE 1: ENVIAR (POST) PARA O MOCKAPI
    function gravarNoMockApi(event) {
        event.preventDefault();

        // Objeto limpo combinando exatamente com o Schema criado no MockAPI
        const dadosMensagem = {
            autor: document.getElementById('autor').value.trim(),
            titulo: document.getElementById('titulo').value.trim(),
            setor: document.getElementById('setor').value.trim(),
            conteudo: document.getElementById('conteudo').value.trim()
        };

        fetch(URL_MOCKAPI, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dadosMensagem)
        })
        .then(function(response) {
            if (response.ok) {
                alert('Sua declaração foi salva com sucesso!');
                document.getElementById('formMensagem').reset(); 
                listarMensagensMockApi(); // Atualiza a tabela na hora
            } else {
                alert('Erro ao tentar salvar no servidor.');
            }
        });
    }

    // PARTE 2: BUSCAR E LISTAR (GET) NA TABELA
    function listarMensagensMockApi() {
        fetch(URL_MOCKAPI)
            .then(function(response) {
                return response.json();
            })
            .then(function(dados) {
                const tabela = document.getElementById('tabelaCorpo');
                tabela.innerHTML = ''; 

                dados.forEach(function(item) {
                    const linha = document.createElement('tr');

                    // Utiliza as propriedades limpas diretamente do banco
                    linha.innerHTML = `
                        <td><strong>${item.autor}</strong></td>
                        <td>${item.titulo}</td>
                        <td>${item.setor}</td>
                        <td>${item.conteudo}</td>
                    `;

                    tabela.appendChild(linha);
                });
            })
            .catch(function(erro) {
                console.log('Nenhum dado encontrado ou erro de conexão.');
            });
    }

    // Inicializa a tabela assim que a página é carregada
    window.onload = listarMensagensMockApi;
</script>

</body>
</html>
