<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples</title>
</head>
<body>
    <h2>Calculadora Simples</h2>

    <input type="number" id="num1" placeholder="Numero 1">
    <input type="number" id="num2" placeholder="Numero 2">
    
    <br><br>

    <button id="botaoSoma">Somar (+)</button>
    <button id="botaoSubtrai">Subtrair (-)</button>
    <button id="botaoMultiplica">Multiplicar (*)</button>
    <button id="botaoDivide">Dividir (/)</button>

    <h3>Resultado: <span id="resultado">0</span></h3>

    <script>
        //Selecionamos os inputs e os botões
        const input1 = document.getElementById("num1");
        const input2 = document.getElementById("num2");
        const displayResultado = document.getElementById("resultado");

        //Função genérica para calcular
        function calcular(operacao) {
            // Convertendo o texto do input para numeros decimais
            const n1 = Number(input1.value);
            const n2 = Number(input2.value);
            let calculo = 0;

            if (operacao === '+') {
                calculo = n1 + n2;
            } else if (operacao === '-') {
                calculo = n1 - n2;
            } else if (operacao === '*') {
                calculo = n1 * n2;
            } else if (operacao === '/') {
                calculo = n2 !== 0 ? n1 / n2 : "Erro: Divisão por 0";
            }

            //Exibimos o resultado na tela
            displayResultado.textContent = calculo;
        }

        //Adicionamos os eventos passando o tipo de operação
        document.getElementById("botaoSoma").addEventListener('click', () => calcular('+'));
        document.getElementById("botaoSubtrai").addEventListener('click', () => calcular('-'));
        document.getElementById("botaoMultiplica").addEventListener('click', () => calcular('*'));
        document.getElementById("botaoDivide").addEventListener('click', () => calcular('/'));
    </script>
</body>
</html>
